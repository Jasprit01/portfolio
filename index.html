<style>
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{--b1:#3446ff;--bg:#0b0e22;--panel:#121737;--line:#262d5e;--text:#e6e8ff;--dim:#7480bd;--blue:#78b0ee;--yellow:#ffd24a;--green:#6ee7a8;--st:#7480bd}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}

body{min-height:100vh;min-height:100dvh;padding:max(22px,env(safe-area-inset-top)) 16px max(26px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;font:400 15px/1.9 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--text);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(120,176,238,.06) 1px,transparent 1px) 0 0/100% 42px,linear-gradient(90deg,rgba(120,176,238,.06) 1px,transparent 1px) 0 0/42px 100%;-webkit-mask-image:radial-gradient(circle at 50% 45%,#000,transparent 72%);mask-image:radial-gradient(circle at 50% 45%,#000,transparent 72%)}
.blob{position:fixed;width:50vmax;height:50vmax;border-radius:50%;filter:blur(100px);opacity:.3;pointer-events:none;animation:drift 20s ease-in-out infinite alternate}
.b1{background:var(--b1);left:-14vmax;top:-12vmax}.b2{background:var(--yellow);right:-16vmax;bottom:-18vmax;opacity:.15;animation-delay:-9s}

.g{position:fixed;top:105%;font-weight:800;pointer-events:none;white-space:nowrap;animation:up linear infinite}
@keyframes up{to{transform:translateY(-120vh) rotate(var(--r))}}
.card{position:relative;width:100%;max-width:860px;z-index:1}
.card:before{content:"";position:absolute;inset:0;border-radius:20px;background:conic-gradient(from var(--a),var(--blue),var(--yellow),#6ee7a8,#ff7ad9,var(--blue));filter:blur(26px);opacity:.3;animation:spin 8s linear infinite}
.win{position:relative;border:1px solid transparent;border-radius:20px;background:linear-gradient(var(--panel),var(--panel)) padding-box,conic-gradient(from var(--a),var(--blue),var(--yellow),#6ee7a8,#ff7ad9,var(--blue)) border-box;animation:spin 8s linear infinite}
@keyframes spin{to{--a:360deg}}
.win:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(280px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--blue) 15%,transparent),transparent 70%)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);color:var(--dim);font-size:.82em}
.bar b{font-weight:500;color:var(--text);padding:2px 12px;border-radius:8px;background:var(--bg)}
.tools{display:flex;align-items:center;gap:10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--yellow);color:#1a1630;padding:8px 18px;border-radius:12px;font-size:12px;font-weight:500;opacity:0;transition:.3s;z-index:9;pointer-events:none;box-shadow:0 0 28px -4px var(--yellow)}.toast.show{opacity:1;transform:translate(-50%,0)}
.em{display:inline-block}
[data-s=online] .em{animation:pulse 1.4s ease-in-out infinite;filter:drop-shadow(0 0 6px #6ee7a8)}
[data-s=idle] .em{transform-origin:50% 0;animation:sway 2.4s ease-in-out infinite;filter:drop-shadow(0 0 6px #ffd24a)}
[data-s=dnd] .em{animation:shake 1.6s ease-in-out infinite;filter:drop-shadow(0 0 6px #ff4d6a)}
[data-s=offline] .em{animation:zz 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.3)}}@keyframes sway{50%{transform:rotate(18deg)}0%,100%{transform:rotate(-18deg)}}
@keyframes shake{0%,70%,100%{transform:none}75%{transform:translateX(-3px) rotate(-8deg)}85%{transform:translateX(3px) rotate(8deg)}}
@keyframes zz{50%{transform:translateY(-5px);opacity:.5}}
.hero{display:flex;gap:20px;align-items:center;padding:28px 24px 10px}
.avw{position:relative;flex:none}
.av{width:96px;height:96px;border-radius:26%;background:#fff url(pfp.jpg) center/cover;border:3px solid var(--st);transition:border-color .4s;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--st) 60%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
.badge{position:absolute;right:-8px;bottom:-8px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:2px solid var(--st);font-size:18px;line-height:1}
h1{font-size:clamp(34px,10vw,64px);font-weight:800;line-height:1.05;letter-spacing:-.04em;background:linear-gradient(100deg,#fff 20%,var(--blue) 55%,var(--yellow));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 6s ease-in-out infinite alternate}
@keyframes sheen{to{background-position:100% 0}}
h1 i{display:inline-block;width:.45ch;height:.85em;margin-left:5px;background:var(--yellow);vertical-align:-.08em;animation:b 1.1s steps(1) infinite;-webkit-text-fill-color:initial}
@keyframes b{50%{opacity:0}}
.code{counter-reset:l;padding:12px 0 14px}
.ln{display:block;padding-right:20px;white-space:pre-wrap;overflow-wrap:anywhere;animation:ty .55s steps(26) calc(var(--i)*.16s + .2s) backwards}
@keyframes ty{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.ln:before{counter-increment:l;content:counter(l);display:inline-block;width:48px;padding-right:16px;text-align:right;color:#434b82}
.k{color:var(--blue)}.s{color:var(--green)}.n{color:var(--yellow)}.c{color:var(--dim)}
#st{color:var(--st);font-weight:500;text-shadow:0 0 12px var(--st)}
.links{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:8px 24px 26px}
.links a{--c:#8ea1ff;position:relative;overflow:hidden;text-align:center;padding:11px 10px;border-radius:14px;color:var(--text);text-decoration:none;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 9%,var(--bg));transition:transform .25s,box-shadow .25s,border-color .25s;animation:rise .6s 1.7s backwards,glow 3.2s ease-in-out 2.4s infinite}
.links a:nth-child(2){--c:#1ed760;animation-delay:1.8s,2.9s}.links a:nth-child(3){--c:#e6e8ff;animation-delay:1.9s,3.4s}.links a:nth-child(4){--c:#ff7ad9;animation-delay:2s,3.9s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}@keyframes glow{50%{box-shadow:0 0 20px -3px var(--c)}}
.links a:hover,.links a:focus-visible{outline:0;transform:translateY(-4px);border-color:var(--c);box-shadow:0 10px 30px -6px var(--c)}
.links a:active{transform:scale(.96)}
.links a:after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);transition:left .7s}
.links a:hover:after{left:130%}
.ic{display:inline-block;width:19px;height:19px;fill:currentColor;vertical-align:-4px;margin-right:8px;transition:transform .3s,filter .3s;filter:drop-shadow(0 0 6px currentColor)}.links a:hover .ic{transform:rotate(-16deg) scale(1.35)}
.player .in{display:flex;align-items:center;gap:16px;padding:18px 20px;position:relative;z-index:1}
.player canvas{position:absolute;left:0;bottom:0;width:100%;height:46px;opacity:.55;border-radius:0 0 20px 20px;pointer-events:none}
.disc{flex:none;width:60px;height:60px;border-radius:50%;background:conic-gradient(from 20deg,#2b3478,#0b0e22,#4a5ac0,#0b0e22,#2b3478);border:1px solid var(--line);position:relative;box-shadow:0 0 22px -6px var(--yellow)}
.disc:after{content:"";position:absolute;inset:40%;border-radius:50%;background:var(--yellow)}
.playing .disc{animation:sp 4s linear infinite}@keyframes sp{to{transform:rotate(1turn)}}
.mid{flex:1;min-width:0}.mid small{display:block;color:var(--dim);font-size:.8em;line-height:1.5}
.mid strong{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.6}
.seek{display:flex;gap:10px;align-items:center;color:var(--dim);font-size:.8em}

@keyframes beat{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--yellow) 14%,transparent),0 0 30px 2px var(--yellow)}}
#pp svg{width:20px;height:20px;fill:currentColor}

@keyframes flow{to{background-position:220% 0}}
.cta:hover,.cta:focus-visible{outline:0;transform:translateY(-5px) scale(1.01);box-shadow:0 20px 56px -10px var(--yellow)}.cta:active{transform:scale(.97)}

.cta small{display:block;font-size:.78em;font-weight:500;opacity:.7;line-height:1.5}.cta b{display:block;font-size:clamp(20px,5.2vw,30px);font-weight:800;letter-spacing:-.03em;line-height:1.2}.cta em{display:block;font-style:normal;font-size:.8em;opacity:.78;line-height:1.5;margin-top:2px}

@keyframes rise{from{opacity:0;transform:translateY(16px)}}
body{transition:opacity .35s,transform .35s}body.leave{opacity:0;transform:scale(.97) translateY(-12px)}
@media(min-width:900px){body{font-size:17px;gap:28px}.hero{padding:40px 40px 12px;gap:32px}.av{width:136px;height:136px}.badge{width:44px;height:44px;font-size:22px}.ln:before{width:60px}.links{grid-template-columns:repeat(4,1fr);padding:10px 40px 36px}.bar{padding:14px 32px}.player .in{padding:22px 32px;gap:22px}.disc{width:72px;height:72px}#pp{width:60px;height:60px}}
